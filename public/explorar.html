<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claridad — Explorar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.PALETTE = {
      "primary": "#10533f", "primary-container": "#2e6b56", "on-primary": "#ffffff",
      "on-primary-container": "#aae9ce", "primary-fixed": "#b1f0d5", "primary-fixed-dim": "#95d3ba",
      "on-primary-fixed": "#002116", "on-primary-fixed-variant": "#0d513d",
      "secondary": "#904d00", "on-secondary": "#ffffff", "secondary-container": "#fe932c",
      "on-secondary-container": "#663500", "secondary-fixed": "#ffdcc3", "secondary-fixed-dim": "#ffb77d",
      "on-secondary-fixed": "#2f1500", "on-secondary-fixed-variant": "#6e3900",
      "tertiary": "#274785", "on-tertiary": "#ffffff", "tertiary-container": "#415f9e",
      "on-tertiary-container": "#cfdbff", "tertiary-fixed": "#d9e2ff", "tertiary-fixed-dim": "#afc6ff",
      "on-tertiary-fixed": "#001944", "on-tertiary-fixed-variant": "#254583",
      "surface": "#fff8f3", "surface-dim": "#e2d8cf",
      "surface-container-lowest": "#ffffff", "surface-container-low": "#fcf2e8",
      "surface-container": "#f6ece3", "surface-container-high": "#f0e7dd",
      "surface-container-highest": "#ebe1d8",
      "on-surface": "#1f1b15", "on-surface-variant": "#404944",
      "outline": "#707974", "outline-variant": "#bfc9c3",
      "error": "#ba1a1a", "on-error": "#ffffff",
    };
    tailwind.config = {
      theme: { extend: {
        colors: PALETTE,
        spacing: { "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2.5rem", "margin": "1.25rem" },
        fontFamily: { sans: ["Inter"], serif: ["Newsreader"] },
        borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
      } },
    };
  </script>
  <style>html,body{margin:0;background:#fff8f3;} body{-webkit-tap-highlight-color:transparent;} ::-webkit-scrollbar{display:none;}</style>
</head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
  <header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(31,27,21,0.03)]">
    <div class="h-16 px-space-lg flex items-center justify-between">
      <div class="flex items-center gap-space-sm">
        <span class="w-7 h-7 rounded-lg bg-primary text-on-primary font-serif flex items-center justify-center">C</span>
        <div class="flex flex-col">
          <span class="font-serif text-[20px] leading-6 text-on-surface tracking-tight">Claridad</span>
          <span class="font-sans text-[11px] text-on-surface-variant/80">Historial incremental</span>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col gap-space-md px-space-lg pt-24 pb-24 bg-surface">
    <section>
      <h1 class="font-serif text-2xl text-on-surface m-0 mb-1">¿Qué cambió desde ayer?</h1>
      <p class="font-sans text-[13px] text-on-surface-variant m-0">
        Cada tema guarda un histórico: lo nuevo os contrastado contra lo ya conocido, no un flujo infinito de titulares.
      </p>
    </section>
    <section id="explorar-list" class="flex flex-col gap-space-sm"></section>
  </main>

  <nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(31,27,21,0.04)]">
    <div class="flex justify-around items-center h-16 px-space-sm">
      <a href="/index.html" class="flex flex-col items-center justify-center w-16 text-on-surface-variant hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined">newspaper</span><span class="font-sans text-xs mt-0.5">Briefing</span>
      </a>
      <a href="/explorar.html" class="flex flex-col items-center justify-center w-16 text-primary font-semibold" aria-current="page">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">explore</span><span class="font-sans text-xs mt-0.5">Explorar</span>
      </a>
      <a href="/fuentes.html" class="flex flex-col items-center justify-center w-16 text-on-surface-variant hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined">verified</span><span class="font-sans text-xs mt-0.5">Fuentes</span>
      </a>
      <a href="/atencion.html" class="flex flex-col items-center justify-center w-16 text-on-surface-variant hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined">spa</span><span class="font-sans text-xs mt-0.5">Atención</span>
      </a>
    </div>
  </nav>

  <script>
    (async function boot() {
      const host = document.querySelector('#explorar-list');
      try {
        const { topics } = await (await fetch('/api/topics')).json();
        host.replaceChildren();
        for (const t of topics) {
          const a = document.createElement('a');
          a.href = '/articulo.html?topic=' + t.slug;
          a.className = 'block no-underline bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-1';
          const head = document.createElement('div');
          head.className = 'flex items-center justify-between';
          head.innerHTML = '<span class="font-sans text-[10px] uppercase tracking-wider font-semibold text-primary"></span>' +
            (t.dedup_count > 0 ? '<span class="font-sans text-[10px] text-on-surface-variant">' + t.dedup_count + ' redundantes condensados</span>' : '');
          head.firstChild.textContent = t.edition;
          const h = document.createElement('h3');
          h.className = 'font-serif text-[19px] text-on-surface leading-snug m-0';
          h.textContent = t.title;
          const p = document.createElement('p');
          p.className = 'font-sans text-xs text-on-surface-variant m-0';
          p.textContent = t.summary || '';
          a.append(head, h, p);
          host.append(a);
        }
      } catch (err) {
        console.error(err);
        host.textContent = 'No se pudo cargar. \u00bfEst\u00e1 corriendo npm run dev?';
      }
    })();
  </script>
</body>
</html>
